<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo a Vive Garage...</title>

  <!-- ========================================== -->
  <!-- SCRIPT DE REDIRECCIÓN AUTOMÁTICA          -->
  <!-- ========================================== -->
  <script>
    // REEMPLAZA LA URL DE ABAJO POR TU NUEVA PÁGINA WEB
    const urlNueva = "https://www.vivegarage.com/cotizador"; 
    
    // Redirige inmediatamente
    window.location.replace(urlNueva);
  </script>
  <!-- ========================================== -->

  <style>
    /* Estilos básicos solo para la pantalla de carga rápida */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #1e293b;
      text-align: center;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #e2e8f0;
      border-top: 5px solid #1b4ed8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .fallback-link {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #64748b;
    }
    .fallback-link a {
      color: #1b4ed8;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Redirigiendo a nuestra nueva plataforma...</h2>
  <p>Estamos preparando tu cotizador.</p>
  
  <!-- Enlace de respaldo por si el navegador bloquea la redirección automática -->
  <div class="fallback-link">
    ¿No te redirige automáticamente? <br>
    <a href="#" id="linkManual">Haz clic aquí para ir al nuevo cotizador</a>
  </div>

  <script>
    // Configura el enlace manual para que use la misma URL de arriba
    document.getElementById('linkManual').href = urlNueva;
  </script>
</body>
</html>
